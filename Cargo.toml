[package]
name = "omniference"
version = "0.8.0"
edition = "2021"
description = "A multi-protocol inference engine with provider adapters"
license = "MIT"
repository = "https://github.com/Henrik-3/omniference"
readme = "README.md"
keywords = ["ai", "llm", "inference", "ollama", "openai"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Core dependencies
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0"
anyhow = "1.0.104"
futures = "0.3.34"
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dotenvy = "0.15.7"
regex = "1.13"
include_dir = "0.7.4"
toml = "1.2"

# HTTP/server
axum = { version = "0.8.9", features = ["multipart"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
reqwest = { version = "0.13", features = ["json", "stream", "multipart", "query"] }
hyper = "1.12"

# Async utilities
tokio-util = "0.7.20"
tokio-stream = "0.1.19"
async-stream = "0.3.6"

# Bytes
bytes = "1.12"
base64 = "0.23"

# Other
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"

# Discord integration (optional)
serenity = { version = "0.12.5", optional = true, default-features = false, features = [
    "client",
    "gateway",
    "model",
    "http",
    "rustls_backend",
] }

[[bin]]
name = "omniference"
path = "src/main.rs"

[[example]]
name = "usage_examples"
path = "examples/usage_examples.rs"

[[example]]
name = "library_usage"
path = "examples/library_usage.rs"

[[example]]
name = "embedded_axum"
path = "examples/embedded_axum.rs"

[[example]]
name = "discord_bot"
path = "examples/discord_bot.rs"
required-features = ["discord"]

[[example]]
name = "standalone_server"
path = "examples/standalone_server.rs"

[features]
default = []
discord = ["dep:serenity"]

[[test]]
name = "omniference_tests"
path = "tests/main.rs"

# Dev dependencies for testing
[dev-dependencies]
dotenvy = "0.15.7"
proptest = "1.12"
insta = { version = "1.49", features = ["json", "redactions"] }

[workspace]
members = ["xtask"]

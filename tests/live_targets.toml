# Live test targets for `case_matrix_live` and `live_reasoning`; see "Live testing" in tests/README.md.
# Several targets may share an adapter. The first target of an adapter records its generic cases.

[[target]]
id = "mistral"
adapter = "openai_compat"
base_url = "https://api.mistral.ai"
key_env = "MISTRAL_API_KEY"
model = "mistral-small-latest"
vendor = "mistral"

[[target]]
id = "openai"
adapter = "openai_responses"
base_url = "https://api.openai.com"
key_env = "OPENAI_API_KEY"
model = "gpt-5.4-mini"
vendor = "openai"

[[target]]
id = "mistral_responses"
adapter = "openai_responses"
